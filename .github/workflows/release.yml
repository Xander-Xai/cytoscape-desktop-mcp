name: Release

# Two components ship from this repo on separate tag namespaces:
#   vX.Y.Z        -> Cytoscape App JAR  (release-app)
#   mcpb-vX.Y.Z   -> MCPB bridge        (release-mcpb, publishes npm + MCP Registry)
#
# The `release` event supports only `types:` filtering — there is no tag-pattern
# filter as with `on: push: tags:` — so the branch is a job-level `if:`. Both jobs
# trigger on every release and one always reports as skipped. That is expected.
on:
  release:
    types: [published]

jobs:
  build-release:
    name: Release Cytoscape App JAR
    if: "!startsWith(github.event.release.tag_name, 'mcpb-v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract and validate version from tag
      id: version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION="${TAG#v}"
        if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
          echo "Error: version '$VERSION' is not valid semver (expected X.Y.Z or X.Y.Z-rc.N)"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build release JAR
      run: xvfb-run make install-release VERSION=${{ steps.version.outputs.version }}

    # Convenience copy of the bridge bundle, so the app release page stays
    # self-sufficient for users. The registry only ever pins the copy attached
    # to an mcpb-v release; the deterministic zip keeps the two byte-identical.
    - name: Build Claude Desktop extension
      run: make build_claude_mcpb

    - name: Upload artifacts to release
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          "build/libs/cytoscape-mcp-${{ steps.version.outputs.version }}.jar" \
          "build/cytoscape-mcp.mcpb" \
          --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mcpb:
    name: Release MCPB bridge
    if: startsWith(github.event.release.tag_name, 'mcpb-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC -> io.github.cytoscape/* namespace on the MCP Registry
      contents: write   # gh release upload

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # No JDK: build_claude_mcpb is pure cp/zip, and nothing here touches Gradle.
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 'lts/*'
        registry-url: https://registry.npmjs.org

    # Fails loudly if the tag and claude-extension/manifest.json disagree.
    - name: Verify tag matches bridge manifest
      run: make check-bridge-version TAG=${{ github.event.release.tag_name }}

    - name: Build bundle
      run: make build_claude_mcpb

    - name: Upload bundle to release
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          "build/cytoscape-mcp.mcpb" \
          --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # RC tags build and upload but never publish: an RC would otherwise consume
    # the version in the registry and pin the RC's asset permanently, after which
    # the guard would silently skip the final release.
    - name: Publish to npm and the MCP Registry
      if: "!contains(github.event.release.tag_name, '-rc.')"
      run: make publish-registry TAG=${{ github.event.release.tag_name }}
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
