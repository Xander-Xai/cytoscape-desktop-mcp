name: MCP Evidence Gate adoption pilot Wave 1.5 Cytoscape
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: 29c420ebb6783122653ae6cbec6ba0713c4b920a
      CORE_RUNTIME_SHA: 06567c840c1d68a4b45ff2d12d6e6c32898fff11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Build MCPB and npm bridge artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' claude-extension/manifest.json)
          make build_claude_mcpb
          test -f build/cytoscape-mcp.mcpb
          make stage-npm-bridge TAG="mcpb-v${VERSION}"
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp build/cytoscape-mcp.mcpb "$RUNNER_TEMP/artifacts/cytoscape-mcp.mcpb"
          (cd build/npm-staging && npm pack --silent) > "$RUNNER_TEMP/bridge-name"
          bridge=$(tail -n 1 "$RUNNER_TEMP/bridge-name")
          test -f "build/npm-staging/$bridge"
          cp "build/npm-staging/$bridge" "$RUNNER_TEMP/artifacts/bridge.tgz"
          sha256sum "$RUNNER_TEMP/artifacts"/* | tee "$RUNNER_TEMP/artifacts.sha256"
      - name: Download pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  '"$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP"
          echo 'd89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791  '"$RUNNER_TEMP/trivy" | sha256sum --check --strict
      - name: Run immutable Producer for MCPB and bridge
        shell: bash
        run: |
          set -u
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          python -m venv "$RUNNER_TEMP/venv"; source "$RUNNER_TEMP/venv/bin/activate"; pip install -q -e "$RUNNER_TEMP/producer"
          cd "$RUNNER_TEMP/producer"
          for pair in 'mcpb:cytoscape-mcp.mcpb' 'bridge:bridge.tgz'; do
            name=${pair%%:*}; file=${pair#*:}; mkdir -p "$RUNNER_TEMP/out/$name"
            set +e
            python -m src.producer --trivy "$RUNNER_TEMP/trivy" --artifact "$RUNNER_TEMP/artifacts/$file" --out "$RUNNER_TEMP/out/$name"
            set -e
          done
      - name: Verify MCPB with immutable Core Action
        id: mcpb
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@06567c840c1d68a4b45ff2d12d6e6c32898fff11
        with:
          receipt: ${{ runner.temp }}/out/mcpb/receipt.json
          artifact: ${{ runner.temp }}/artifacts/cytoscape-mcp.mcpb
          evidence: ${{ runner.temp }}/out/mcpb/evidence.json
          policy: strict-scanner-completeness
      - name: Verify bridge with immutable Core Action
        id: bridge
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@06567c840c1d68a4b45ff2d12d6e6c32898fff11
        with:
          receipt: ${{ runner.temp }}/out/bridge/receipt.json
          artifact: ${{ runner.temp }}/artifacts/bridge.tgz
          evidence: ${{ runner.temp }}/out/bridge/evidence.json
          policy: strict-scanner-completeness
      - name: Verify MCPB tamper control
        id: mcpb_negative
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@06567c840c1d68a4b45ff2d12d6e6c32898fff11
        with:
          receipt: ${{ runner.temp }}/out/mcpb/receipt.json
          artifact: ${{ runner.temp }}/artifacts/cytoscape-mcp.mcpb
          evidence: ${{ runner.temp }}/out/mcpb/evidence.json
          policy: strict-scanner-completeness
      - name: Verify bridge tamper control
        id: bridge_negative
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@06567c840c1d68a4b45ff2d12d6e6c32898fff11
        with:
          receipt: ${{ runner.temp }}/out/bridge/receipt.json
          artifact: ${{ runner.temp }}/artifacts/bridge.tgz
          evidence: ${{ runner.temp }}/out/bridge/evidence.json
          policy: strict-scanner-completeness      - name: Upload Cytoscape evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-evidence-gate-wave15-cytoscape-${{ github.sha }}
          path: |
            ${{ runner.temp }}/artifacts.sha256
            ${{ runner.temp }}/out
          retention-days: 90
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          echo "MCPB gate=${{ steps.mcpb.outcome }} decision=${{ steps.mcpb.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "bridge gate=${{ steps.bridge.outcome }} decision=${{ steps.bridge.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
